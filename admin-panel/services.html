<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Services & Plans</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="gc-toast" class="toast"></div>

<div class="admin-layout">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="admin-sidebar">
    <div class="sidebar-logo">
      🌿 Admin
      <span>Panel</span>
    </div>
    <nav class="admin-nav">
      <a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="dashboard.html"><span class="nav-icon">📋</span> Bookings</a>
      <a href="services.html" class="active"><span class="nav-icon">🌿</span> Services & Plans</a>
      <a href="dashboard.html"><span class="nav-icon">📊</span> Sales Analytics</a>
      <div style="margin-top:auto;padding:22px 0 0">
        <button id="logout-btn" style="background:none;border:none;width:100%;text-align:left;padding:11px 22px;color:#c8e6c9;font-size:.94rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px">
          <span class="nav-icon">🚪</span> Log Out
        </button>
      </div>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="admin-main">

    <div class="admin-topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button id="sidebar-toggle" style="display:none;background:none;border:none;cursor:pointer;font-size:1.4rem">☰</button>
        <h2>Services & Plans</h2>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:.85rem;color:var(--text-light)" id="admin-date"></span>
        <div style="width:36px;height:36px;border-radius:50%;background:var(--green-main);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">A</div>
      </div>
    </div>

    <div class="admin-content">

      <!-- Individual Services -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px">
        <h3 style="font-size:1.1rem;color:var(--text-dark)">Individual Services</h3>
        <button class="btn btn-green btn-sm" onclick="openAddItem('service')">+ Add Service</button>
      </div>
      <div class="service-admin-grid" id="services-grid">
        <div style="color:var(--text-light);padding:30px;text-align:center;grid-column:1/-1">Loading…</div>
      </div>

      <!-- Plans -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin:36px 0 18px;flex-wrap:wrap;gap:12px">
        <h3 style="font-size:1.1rem;color:var(--text-dark)">Monthly Plans</h3>
        <button class="btn btn-green btn-sm" onclick="openAddItem('plan')">+ Add Plan</button>
      </div>
      <div class="service-admin-grid" id="plans-grid">
        <div style="color:var(--text-light);padding:30px;text-align:center;grid-column:1/-1">Loading…</div>
      </div>

      <!-- Add-Ons -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin:36px 0 18px;flex-wrap:wrap;gap:12px">
        <h3 style="font-size:1.1rem;color:var(--text-dark)">Add-Ons</h3>
        <button class="btn btn-green btn-sm" onclick="openAddItem('addon')">+ Add Add-On</button>
      </div>
      <div class="service-admin-grid" id="addons-grid">
        <div style="color:var(--text-light);padding:30px;text-align:center;grid-column:1/-1">Loading…</div>
      </div>

    </div><!-- /admin-content -->
  </div><!-- /admin-main -->
</div><!-- /admin-layout -->

<!-- ADD / EDIT MODAL -->
<div class="modal-overlay" id="item-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('item-modal')">✕</button>
    <h3 id="item-modal-title">Add New Service</h3>
    <span id="item-id-display" style="font-size:.8rem;color:var(--text-light)"></span>
    <form id="item-form">
      <input type="hidden" id="item-type-hidden" value="service"/>
      <input type="hidden" id="item-edit-id" value=""/>
      <div class="modal-form-grid">
        <div>
          <label>Icon (emoji)</label>
          <input type="text" id="item-icon" placeholder="🌿">
        </div>
        <div>
          <label>Name</label>
          <input type="text" id="item-name" placeholder="e.g. Premium Mow & Edge" required>
        </div>
        <div>
          <label>Price</label>
          <input type="text" id="item-price" placeholder="From $45 / visit  (or $139 for a plan)">
        </div>
        <div>
          <label>Description</label>
          <textarea id="item-description" rows="3" placeholder="What's included…"></textarea>
        </div>
        <div>
          <label style="display:flex;align-items:center;gap:8px;font-weight:700">
            <input type="checkbox" id="item-featured" style="width:auto">
            Featured (highlight this plan as "Most Popular")
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline btn-sm" style="color:var(--text-dark);border-color:#ccc" onclick="closeModal('item-modal')">Cancel</button>
        <button type="submit" class="btn btn-green btn-sm">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin-api.js"></script>
<script src="js/admin-ui.js"></script>
</body>
</html>
